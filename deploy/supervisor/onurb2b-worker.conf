[program:onurb2b-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/onurb2b/artisan queue:work redis --sleep=1 --tries=1 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/onurb2b/storage/logs/worker.log
stopwaitsecs=3600
